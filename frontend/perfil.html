<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Selecionar perfil</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="cabecalho"></div>
  <div id="modalAvisoContainer"></div>

  <main class="container">
    <h2>Selecionar perfil</h2>

    <div class="card">
      <small id="perfilMeta" style="display:block; color:#555; margin-bottom:12px;">—</small>

      <div id="perfilButtons" class="acoes" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
        <!-- preenchido via JS -->
      </div>

      <small style="display:block; color:#666; margin-top:12px;">
        Você pode ter mais de um perfil. A seleção altera o que aparece no app e restringe ações a este perfil.
      </small>
    </div>
  </main>

  <div id="rodape"></div>

  <script type="module" src="js/incluirComponentes.js"></script>
  <script type="module" src="js/modalAviso.js"></script>
  <script type="module" src="js/perfil.js"></script>
</body>
</html>
