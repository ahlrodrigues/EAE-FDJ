<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Programa de Aulas (Dirigente)</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="cabecalho"></div>
  <div id="menuSuperior"></div>
  <div id="modalAvisoContainer"></div>

  <main class="container-wide">
    <h2>Programa de Aulas</h2>

    <div class="card card-wide" data-roles="dirigente,analista">
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
        <div style="flex:1; min-width:220px;">
          <label for="filtroPrograma">Buscar (aula/tema/texto)</label>
          <input id="filtroPrograma" type="text" placeholder="ex.: mau humor, 18, tema 2..." autocomplete="off" />
        </div>
        <div style="flex:0 0 220px;">
          <label for="programaTurmaId">Turma ID</label>
          <input id="programaTurmaId" type="text" placeholder="TurmaIdA1B2C3" autocomplete="off" />
        </div>
        <div style="flex:0 0 180px;">
          <label for="programaStartDate">Data da aula 1</label>
          <input id="programaStartDate" type="date" />
        </div>
        <div style="flex:0 0 auto;">
          <button id="btnRecarregarPrograma" type="button" class="btn-secundario">Recarregar</button>
        </div>
      </div>

      <small id="programaMeta" style="display:block; margin-top:10px; color:#555;">
        —
      </small>

      <div class="programa-grid-wrap">
        <table class="programa-grid">
          <thead id="programaHead"></thead>
          <tbody id="programaBody"></tbody>
        </table>
      </div>

      <div class="acoes" style="margin-top: 14px; display:flex; gap:10px; flex-wrap:wrap;">
        <button id="btnSalvarProgramaLocal" type="button" class="btn-principal">Salvar programa (local)</button>
        <button id="btnAdicionarLinhaFim" type="button" class="btn-secundario">Adicionar linha</button>
        <button id="btnAplicarSemanal" type="button" class="btn-secundario">Aplicar semanal</button>
        <button id="btnSalvarProgramaDatas" type="button" class="btn-principal">Salvar datas (local)</button>
      </div>
    </div>

    <div class="card" data-roles="aluno">
      <h3>Acesso restrito</h3>
      <small style="display:block; color:#555;">
        Esta área é destinada ao dirigente/analista.
      </small>
    </div>
  </main>

  <div id="rodape"></div>

  <script type="module" src="js/incluirComponentes.js"></script>
  <script type="module" src="js/modalAviso.js"></script>
  <script type="module" src="js/programa.js"></script>
</body>
</html>
