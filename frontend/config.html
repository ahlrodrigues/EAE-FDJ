<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro / Edição</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="cabecalho"></div>

  <!-- Menus -->
  <div id="menuSuperior"></div>

  <!-- Modal padronizado -->
  <div id="modalAvisoContainer"></div>

  <h2 id="titulo-formulario">Cadastro de Usuário</h2>

  <!-- === Card: Dados do Usuário === -->
  <div class="card">
    <form id="configForm" novalidate>
      <!-- LOG: início do form de configuração -->

      <label for="casaEspírita">Nome da casa espírita</label>
      <input
        type="text" id="casaEspírita" placeholder="Nome da casa espírita" required
        autocomplete="organization" autocapitalize="words" spellcheck="false"
      />

      <label for="numeroTurma">Número da turma</label>
      <input
        type="number" id="numeroTurma" placeholder="Número da turma" required
        min="1" inputmode="numeric"
      />

      <label for="dirigente">Nome do dirigente</label>
      <input
        type="text" id="dirigente" placeholder="Nome do dirigente" required
        autocomplete="name" autocapitalize="words" spellcheck="false"
      />

      <label for="emailDirigente">E-mail do dirigente</label>
      <input
        type="email" id="emailDirigente" placeholder="E-mail do dirigente" required
        autocomplete="email" inputmode="email"
      />

      <label for="secretarios">Nomes dos secretários</label>
      <input
        type="text" id="secretarios" placeholder="Nomes dos secretários" required
        autocomplete="off" autocapitalize="words" spellcheck="false"
      />

      <label for="aluno">Nome do aluno</label>
      <input
        type="text" id="aluno" placeholder="Nome do aluno" required
        autocomplete="name" autocapitalize="words" spellcheck="false"
      />

      <label for="email">E-mail do aluno</label>
      <input
        type="email" id="email" placeholder="E-mail do aluno" required
        autocomplete="email" inputmode="email"
      />

      <label for="telefone">Telefone com +DDI e DDD</label>
      <input
        type="tel" id="telefone" placeholder="Telefone com DDI e DDD (ex: +55 11 91234-5678)" required
        autocomplete="tel" inputmode="tel"
        pattern="^\+\d{2}\s?\d{2}\s?\d{4,5}-?\d{4}$"
        title="Use o formato +55 11 91234-5678"
      />

      <label for="codigoTemas">Código das atividades</label>
      <input
        type="text" id="codigoTemas" placeholder="Código da planilha" required
        autocomplete="off" autocapitalize="off" spellcheck="false"
      />

      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <label for="idioma">Idioma:</label>
        <img id="bandeiraIdioma" src="https://flagcdn.com/24x18/br.png" alt="Bandeira do idioma atual" />
        <select id="idioma" name="idioma" autocomplete="language">
          <option value="pt" data-flag="br" selected>Português</option>
          <option value="en" data-flag="us">English</option>
          <option value="fr" data-flag="fr">Français</option>
          <option value="de" data-flag="de">Deutsch</option>
          <option value="it" data-flag="it">Italiano</option>
        </select>
      </div>

      <button type="submit" class="btn-principal" id="btn-acao">Salvar Alterações</button>
      <!-- LOG: submit do form acionado -->
    </form>
  </div>

<!-- === Card: Backup (fora do form) === -->
<div class="card" id="card-backup">
  <h2>Backup</h2>

  <div class="form-group">
    <label for="backup-servico">Serviço</label>
    <select id="backup-servico">
      <option value="">Selecione…</option>
      <option value="google-drive">Google Drive</option>
      <option value="dropbox" disabled>Dropbox (em breve)</option>
      <option value="onedrive" disabled>OneDrive (em breve)</option>
    </select>
    <div class="erro-campo" id="erro-backup-servico" style="display:none;"></div>
  </div>

  <!-- Linha de OAuth (JS mostra apenas quando Google Drive for selecionado) -->
  <div class="form-group" id="oauth-row" style="display:none;">
    <button id="btn-backup-oauth" class="btn-principal" type="button">Conectar Google</button>
    <span id="oauth-status" class="oauth-status">Desconectado</span>
  </div>

  <div style="height: 0.8rem;"></div>

  <div class="form-group">
    <label for="backup-pasta-remota">Pasta no Google Drive</label>
    <input id="backup-pasta-remota" type="text" value="EAEbackup" readonly disabled
           aria-describedby="hint-pasta" />
    <small id="hint-pasta" class="assistive">
      Será criada na raiz do seu Google Drive.
    </small>
    <div class="erro-campo" id="erro-backup-pasta" style="display:none;"></div>
  </div>

  <fieldset class="form-group" aria-describedby="backup-modo-ajuda">
    <legend>Modo</legend>
    <div class="radio-row">
      <label class="radio-item">
        <input type="radio" name="backup-modo" value="manual" checked />
        <span class="radio-label">
          <strong>Sob demanda</strong>
          <small class="hint">Você decide quando executar (botão “Executar agora”).</small>
        </span>
      </label>

      <label class="radio-item">
        <input type="radio" name="backup-modo" value="agendado" />
        <span class="radio-label">
          <strong>Agendado diário</strong>
          <small class="hint">Roda automaticamente no horário definido abaixo.</small>
        </span>
      </label>

      <label class="radio-item">
        <input type="radio" name="backup-modo" value="continuo" />
        <span class="radio-label">
          <strong>Contínuo</strong>
          <small class="hint">Monitora alterações e envia incrementos (maior uso de recursos).</small>
        </span>
      </label>
    </div>
  </fieldset>

  <!-- Linha do horário (começa oculta; JS mostra quando modo = agendado) -->
  <div id="agendamento-row" class="agendamento-linha" style="display:none">
    <label for="backup-horario">Horário (agendado diário):</label>
    <input id="backup-horario" type="time" step="60" value="22:30" />
  </div>

  <!-- Botões com Testar + Executar lado a lado e Salvar abaixo -->
  <div class="form-actions form-actions--grid">
    <button id="btn-backup-testar" class="btn-principal" type="button">Testar conexão</button>
    <button id="btn-backup-executar" class="btn-principal" type="button">Executar agora</button>
    <button id="btn-backup-salvar" class="btn-principal btn-full" type="button">Salvar configurações</button>
  </div>

  <small id="backup-ultima-info" class="ultima-info">
    Último backup: —
  </small>
</div>


  <div id="rodape"></div>

  <!-- Scripts (sempre no final para carregar após o DOM) -->
  <script type="module" src="js/config.js"></script>
  <script type="module" src="./js/backupConfig.js"></script>
</body>
</html>
